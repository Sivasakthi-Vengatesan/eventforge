version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: rheos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-rheos}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rheos-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rheos-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-rheos}
      REDIS_URL: redis://redis:6379/0
      WORKER_COUNT: 4
      MAX_RETRIES: 5
      WEBHOOK_SECRET_STRIPE: ${WEBHOOK_SECRET_STRIPE:-whsec_stripe_test_secret_38472948}
      WEBHOOK_SECRET_RAZORPAY: ${WEBHOOK_SECRET_RAZORPAY:-rzp_sec_razorpay_test_98372184}
      WEBHOOK_SECRET_GITHUB: ${WEBHOOK_SECRET_GITHUB:-gh_sec_github_test_84729184}
      WEBHOOK_SECRET_GENERIC: ${WEBHOOK_SECRET_GENERIC:-gen_sec_generic_test_19284729}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: rheos-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
