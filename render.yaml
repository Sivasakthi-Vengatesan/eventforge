services:
  # Backend API & Asynchronous Worker Gateway
  - type: web
    name: rheos-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    region: oregon
    plan: standard
    envVars:
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        fromDatabase:
          name: rheos-postgres
          property: connectionString
      - key: REDIS_URL
        value: redis://localhost:6379/0
      - key: USE_EMBEDDED_STREAM_FALLBACK
        value: "true"
      - key: WEBHOOK_SECRET_STRIPE
        value: whsec_stripe_test_secret_38472948
      - key: WEBHOOK_SECRET_GITHUB
        value: gh_sec_github_test_84729184
      - key: WEBHOOK_SECRET_RAZORPAY
        value: rzp_sec_razorpay_test_98372184
      - key: WEBHOOK_SECRET_GENERIC
        value: gen_sec_generic_test_19284729

  # Frontend Swiss International Dashboard (Static Site)
  - type: web
    name: rheos-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: rheos-postgres
    databaseName: rheos
    user: postgres
    region: oregon
    plan: free
